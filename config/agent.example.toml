# Copy to agent.local.toml. The local file is ignored by Git.

[agent]
# Switch this value to any table under [providers].
provider = "deepseek"
fallback_provider = "deterministic"
fallback_on_error = true
timeout_seconds = 30
profile_path = "config/agent.local.md"
profile_max_chars = 16000

[providers.deepseek]
adapter = "openai_compatible"
base_url = "https://api.deepseek.com"
endpoint = "/chat/completions"
api_key = ""
model = "deepseek-v4-flash"
max_tokens = 800
temperature = 0.0
json_mode = true

[providers.openai]
adapter = "openai_compatible"
base_url = "https://api.openai.com/v1"
endpoint = "/chat/completions"
api_key = ""
model = ""
max_tokens = 800
temperature = 0.0
json_mode = true

[providers.openai_compatible]
# Use this for OpenRouter, Qwen-compatible mode, local vLLM, Ollama proxies, etc.
adapter = "openai_compatible"
base_url = ""
endpoint = "/chat/completions"
api_key = ""
model = ""
max_tokens = 800
temperature = 0.0
json_mode = true

[providers.anthropic]
adapter = "anthropic"
base_url = "https://api.anthropic.com"
endpoint = "/v1/messages"
api_key = ""
model = ""
api_version = "2023-06-01"
max_tokens = 800
temperature = 0.0

[providers.gemini]
adapter = "gemini"
base_url = "https://generativelanguage.googleapis.com"
api_key = ""
model = ""
max_tokens = 800
temperature = 0.0
