[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronos"
version = "0.1.0"
description = "A local-first work-state estimation and dynamic planning engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "YijieYing" }]
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

